apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: rag-prod

patches:
  - path: backend-prod.yaml
    target:
      kind: Deployment
      name: backend
  - path: frontend-prod.yaml
    target:
      kind: Deployment
      name: frontend

secretGenerator:
  - name: backend-secrets
    literals:
      - database-url=$(DATABASE_URL)
      - openai-api-key=$(OPENAI_API_KEY)
